name: Uptime

# Every 15 minutes: does the app answer, and does the API reach the database?
# A failed run is how you get told (GitHub emails the person who last edited
# this schedule; see README.md).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: App and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets only ever come in through the environment and are never echoed.
    env:
      APP_URL: ${{ secrets.APP_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check the secrets exist
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README.md)"
            exit 1
          fi

      # --retry only repeats on timeouts and 5xx answers, so one blip does not
      # send an alert but a real outage still fails.
      - name: The app answers 200
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$APP_URL") || code="no-response"
          echo "App answered: $code"
          [ "$code" = "200" ] || { echo "::error::The app did not answer 200 (got $code)"; exit 1; }

      # ping() reads no tables; a 200 means the gateway, PostgREST and the
      # database are all up. A publishable key is not a JWT, so it goes in the
      # apikey header only.
      - name: The API reaches the database
        if: ${{ !cancelled() }}
        run: |
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}') || code="no-response"
          echo "API answered: $code"
          [ "$code" = "200" ] || { echo "::error::The API did not answer 200 (got $code)"; exit 1; }
          grep -Eq '^"[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$body" || { echo "::error::ping() did not return a timestamp"; exit 1; }

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer run of the same ref replaces an older one that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (migrations and pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # The tests only need Postgres: every other service is left out, which
      # also skips the analytics containers that make a full start slow.
      - name: Start the local database
        run: >
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply every migration and the seed
        run: supabase db reset

      - name: Run the pgTAP tests
        run: supabase test db

  web:
    name: Web (build and lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # Warnings are allowed for now; an error fails the job.
      - run: npm run lint
